[package]
name = "cs2-craft"
version = "0.4.0"
description = "A personal Counter-Strike 2 cosmetics catalog"
edition = "2021"
default-run = "cs2-craft"

[lib]
name = "cs2_craft_lib"
crate-type = ["rlib"]

[features]
verification = []

[[bin]]
name = "catalog-check"
path = "src/bin/catalog-check.rs"
required-features = ["verification"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "brotli"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.48"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
rayon = "1.10"
url = "2"
strsim = "0.11"

[profile.release]
opt-level = 3
strip = true

